# ジョグ較正結果 2026-08-03
# 角度の単位はモータ報告値(=減速機入力側ロータ角、0x92/0xA4の値そのまま)。
# 出力軸角 = 相対角 / gear_ratio
#
# 水平の絶対基準は単回転エンコーダ値(level_encoder)で保持しており電源断でも有効。
# 起動時にセンサが水平からロータ±180°(出力軸±29°)以内にあれば自動復元される。
# → 電源再投入時は「だいたい水平」に合わせてから起動すればよい。
motor_id: 1
level_encoder: 33735       # 水平位置の単回転エンコーダ値(65536/回転)
upper_rel_deg: 306.38      # 水平からの+側限界(上向き、干渉直前) → 出力軸 約+49.4°
lower_rel_deg: -322.38     # 水平からの−側限界(下向き、干渉直前) → 出力軸 約-52.0°
margin_deg: 12.0           # 限界からの安全マージン(ロータ角。出力軸で約2°)
max_level_offset_deg: 120.0  # 起動時の水平からの許容ズレ(超えたら誤復元防止のため起動拒否)
gear_ratio: 6.2            # GYEMS RMD-X8 Pro 標準減速比
axis: y                    # ピッチ(お辞儀)構成
sign: -1.0                 # モータ+ = センサ上向き。REP-103でY軸回り+は前傾のため負
